[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mono-kit"
version = "0.2.0"
readme = "README.md"
description = "Mono-Kit is a developer-focused machine learning toolkit built for effortless multimodal retrieval. Powered by a Rust-based vector database engine and multimodal embedding models, it unifies text, images, audio, and video within a shared embedding space, enabling fast and intuitive cross-modal search across diverse data types."
requires-python = ">=3.12"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "torchcodec==0.14.0",
    "numpy==2.4.4",
    "opencv-python==4.13.0.92",
    "pillow==12.2.0",
    "python-magic==0.4.27",
    "tiktoken==0.13.0",
    "typeguard==4.5.1",
    "bitsandbytes==0.49.2",
    "accelerate==1.14.0",
    "iopath==0.1.10",
    "fvcore==0.1.5.post20221221",
    "pytorchvideo==0.1.5",
    "timm==1.0.26",
    "ftfy==6.3.1",
    "huggingface_hub==0.23.4",
    "imagebind @ git+https://github.com/facebookresearch/ImageBind.git",
]

[tool.maturin]
# Points to the Rust engine manifest inside the package
manifest-path = "mono_v2/rust_engine/Cargo.toml"
# This tells maturin that our python package is in the root
python-source = "."
# The module name must match the package structure if it's inside
module-name = "mono_v2.rust_engine"
features = ["pyo3/extension-module"]
