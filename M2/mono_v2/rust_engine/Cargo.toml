[package]
name = "memmap_index"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }

numpy = "0.23"

# IMPORTANT
# must match numpy's ndarray ecosystem
ndarray = "0.16"

memmap2 = "0.9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

serde-pyobject = "0.6"
pythonize = "0.23"

bincode = "1.3"